<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIQ — Prophet page (Yusuf) (design prototype)</title>
<!-- Finalised design reference for Claude Code. Self-contained: tokens, components, React 18.3.1 (MIT) inlined. DRAFT content. -->
<style>@import url("https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap");
/* ZIQ components — tokens come from tokens.css. Logical properties throughout so RTL mirrors for free. */
.zq, .zq * { box-sizing: border-box; }
body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); margin: 0; }
.zq-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4); }
.zq-stack { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); }
.zq-focus:focus-visible, .zq-btn:focus-visible, .zq-chip:focus-visible, .zq-input:focus-visible, .zq-iconbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Button */
.zq-btn { font: 600 14px/20px var(--font-sans); min-height: var(--control-height); padding: 0 var(--space-4); border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-2); transition: background-color .15s; }
.zq-btn-primary { background: var(--brand); color: var(--on-brand); }
.zq-btn-primary:hover { background: color-mix(in srgb, var(--brand) 88%, var(--ink)); }
.zq-btn-secondary { background: var(--surface-raised); color: var(--ink); border-color: var(--border); }
.zq-btn-secondary:hover { background: var(--sage-soft); }
.zq-btn-quiet { background: transparent; color: var(--ink); }
.zq-btn-quiet:hover { background: var(--sage-soft); }
.zq-btn-danger { background: transparent; color: var(--status-danger); border-color: var(--status-danger); }
.zq-btn:active { transform: translateY(1px); }
.zq-btn[disabled], .zq-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; transform: none; }
.zq-btn-sm { min-height: 32px; padding: 0 var(--space-3); font-size: 13px; }
.zq-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-inline-end-color: transparent; animation: zq-spin .8s linear infinite; }
@keyframes zq-spin { to { transform: rotate(360deg); } }

/* Evidence label */
.zq-ev { display: inline-flex; align-items: center; gap: var(--space-1); font: 600 13px/18px var(--font-sans); letter-spacing: .01em; padding: 2px var(--space-2); border-radius: var(--radius-xs); border: 1.5px solid currentColor; background: var(--surface-raised); white-space: nowrap; }
.zq-ev svg { width: 12px; height: 12px; flex: none; }
.zq-ev-quran { background: var(--ev-quran); color: var(--on-brand); border-color: var(--ev-quran); }
.zq-ev-hadith { color: var(--ev-hadith); }
.zq-ev-scholar { color: var(--ev-scholar); }
.zq-ev-estimate { color: var(--ev-estimate); border-style: dashed; }
.zq-ev-disputed { color: var(--ev-disputed); border-style: double; border-width: 3px; padding: 1px 7px; }
.zq-ev-unknown { color: var(--ev-unknown); border-style: dotted; border-width: 2px; }

/* Citation chip */
.zq-chip { display: inline-flex; align-items: center; gap: var(--space-1); font: 500 13px/18px var(--font-mono); color: var(--ink); background: var(--surface-sunken); border: 1px solid var(--hairline); border-radius: var(--radius-xs); padding: 2px var(--space-2); text-decoration: none; cursor: pointer; }
.zq-chip:hover { border-color: var(--border); background: var(--sage-soft); }
.zq-chip-kind { font-family: var(--font-sans); font-weight: 600; color: var(--ink-muted); }

/* Hadith grade */
.zq-grade { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-2); font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
.zq-grade b { color: var(--ink); font-weight: 600; }
.zq-grade-varies { color: var(--ev-disputed); font-weight: 600; font-size: 13px; }

/* Cards */
.zq-card { background: var(--surface-raised); border: 1px solid var(--hairline); border-radius: var(--radius-md); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); max-width: 720px; }
.zq-card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--space-2); }
.zq-eyebrow { font: 600 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--brass-ink); margin: 0; }
.zq-title { font: 600 18px/26px var(--font-sans); margin: 0; color: var(--ink); }
.zq-meta { font: 400 14px/20px var(--font-sans); color: var(--ink-muted); margin: 0; }
.zq-ar-quran { font-family: var(--font-quran); font-size: 30px; line-height: 2.1; direction: rtl; text-align: start; margin: 0; color: var(--ink); }
.zq-ar-naskh { font-family: var(--font-naskh); font-size: 21px; line-height: 1.9; direction: rtl; text-align: start; margin: 0; color: var(--ink); }
.zq-trans { font: 400 16px/26px var(--font-sans); margin: 0; color: var(--ink); max-width: var(--measure-reading); }
.zq-demo { font: 600 11px/14px var(--font-mono); color: var(--status-warning); border: 1px solid currentColor; border-radius: var(--radius-xs); padding: 1px 4px; }
.zq-actions { display: flex; flex-wrap: wrap; gap: var(--space-1); border-top: 1px solid var(--hairline); padding-top: var(--space-3); }
.zq-iconbtn { display: inline-flex; align-items: center; gap: var(--space-1); background: none; border: 0; color: var(--ink-muted); font: 600 13px/18px var(--font-sans); padding: var(--space-2); border-radius: var(--radius-sm); cursor: pointer; }
.zq-iconbtn:hover { background: var(--sage-soft); color: var(--ink); }
.zq-iconbtn[aria-pressed="true"] { color: var(--brand); }
.zq-iconbtn svg { width: 16px; height: 16px; }
.zq-licence { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.zq-licence-pending { color: var(--status-warning); font-weight: 600; }
.zq-gradings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-1); border-inline-start: 2px solid var(--hairline); padding-inline-start: var(--space-3); }

/* Date confidence track */
.zq-track { position: relative; height: 24px; margin-block: var(--space-1); }
.zq-track-line { position: absolute; inset-inline: 0; top: 11px; height: 2px; background: var(--hairline); }
.zq-track-exact { position: absolute; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); }
.zq-track-range { position: absolute; top: 7px; height: 10px; border-radius: var(--radius-xs); background: var(--sage); border: 1.5px solid var(--slate); }
.zq-track-est { position: absolute; top: 7px; height: 10px; border-radius: var(--radius-xs); border: 1.5px dashed var(--slate); background: repeating-linear-gradient(135deg, transparent 0 4px, var(--sage-soft) 4px 7px); }
.zq-track-rel { position: absolute; top: 6px; width: 12px; height: 12px; transform: rotate(45deg); border: 2px solid var(--brass-ink); background: var(--surface-raised); }
.zq-track-unknown { position: absolute; inset-inline: 0; top: 4px; height: 16px; border: 2px dotted var(--ev-unknown); border-radius: var(--radius-xs); }
.zq-datelabel { font: 600 13px/18px var(--font-sans); color: var(--ink); }

/* Prophet card */
.zq-prophet { display: grid; grid-template-columns: 56px 1fr; gap: var(--space-3) var(--space-4); align-items: center; }
.zq-prophet-mark { width: 56px; height: 56px; color: var(--brass); }
.zq-prophet-name { font: 600 22px/28px var(--font-display); margin: 0; color: var(--ink); }
.zq-prophet-ar { font: 400 20px/1.6 var(--font-naskh); color: var(--ink-muted); direction: rtl; }
.zq-order { font: 500 13px/18px var(--font-mono); color: var(--ink-muted); }

/* Map legend */
.zq-legend { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); max-width: 280px; box-shadow: var(--shadow-float); }
.zq-legend h3 { margin: 0; font: 600 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.zq-legend ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.zq-legend li { display: flex; align-items: center; gap: var(--space-3); font: 400 14px/20px var(--font-sans); color: var(--ink); }
.zq-legend svg { width: 28px; height: 20px; flex: none; }
.zq-legend-attr { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); border-top: 1px solid var(--hairline); padding-top: var(--space-2); }

/* Genealogy */
.zq-gen { display: flex; align-items: center; gap: 0; flex-wrap: wrap; padding: var(--space-4); }
.zq-node { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--space-2) var(--space-4); border-radius: var(--radius-pill); background: var(--surface-raised); border: 1.5px solid var(--border); min-width: 120px; text-align: center; cursor: pointer; font-family: var(--font-sans); color: var(--ink); }
.zq-node:hover { background: var(--sage-soft); }
.zq-node[aria-current="true"] { border-color: var(--brand); border-width: 2px; background: var(--sage-soft); }
.zq-node-unknown { border-style: dotted; color: var(--ev-unknown); }
.zq-node-name { font: 600 14px/20px var(--font-sans); }
.zq-node-gen { font: 500 11px/14px var(--font-mono); color: var(--ink-muted); }
.zq-edge { display: inline-flex; flex-direction: column; align-items: center; min-width: 84px; gap: 2px; }
.zq-edge-line { width: 100%; height: 0; border-top: 2px solid var(--brand); }
.zq-edge-disputed .zq-edge-line { border-top: 4px double var(--ev-disputed); }
.zq-edge-unknown .zq-edge-line { border-top: 2px dotted var(--ev-unknown); }
.zq-edge-label { font: 600 11px/14px var(--font-sans); color: var(--ink-muted); }

/* Editorial status */
.zq-status { display: inline-flex; align-items: center; gap: var(--space-1); font: 600 13px/18px var(--font-sans); padding: 2px var(--space-2); border-radius: var(--radius-sm); background: var(--surface-sunken); color: var(--ink); }
.zq-status-dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
.zq-status-draft { color: var(--ink-muted); }
.zq-status-in_review { color: var(--status-info); }
.zq-status-in_review .zq-status-dot { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.zq-status-approved { color: var(--status-success); }
.zq-status-published { color: var(--status-success); }
.zq-status-published .zq-status-dot, .zq-status-approved .zq-status-dot { background: currentColor; }
.zq-status-correction { color: var(--status-warning); }
.zq-status-rejected { color: var(--status-danger); }
.zq-status-rejected .zq-status-dot { border-radius: 1px; }

/* Comment */
.zq-comment { display: grid; grid-template-columns: 32px 1fr; gap: var(--space-2) var(--space-3); padding: var(--space-4) 0; border-bottom: 1px solid var(--hairline); max-width: 680px; }
.zq-avatar { width: 32px; height: 32px; border-radius: var(--radius-pill); background: var(--sage-soft); color: var(--sage-ink); display: grid; place-items: center; font: 600 13px/1 var(--font-sans); }
.zq-comment-head { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: baseline; }
.zq-comment-author { font: 600 14px/20px var(--font-sans); }
.zq-comment-body { font: 400 15px/24px var(--font-sans); margin: var(--space-1) 0 var(--space-2); }
.zq-comment-removed { font: italic 400 14px/20px var(--font-sans); color: var(--ink-muted); border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); }

/* Text field */
.zq-field { display: flex; flex-direction: column; gap: var(--space-1); max-width: 420px; }
.zq-field label { font: 600 13px/18px var(--font-sans); color: var(--ink); }
.zq-input { min-height: var(--control-height); padding: 0 var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-raised); color: var(--ink); font: 400 16px/24px var(--font-sans); width: 100%; }
.zq-input::placeholder { color: var(--ink-muted); }
.zq-input[aria-invalid="true"] { border-color: var(--status-danger); border-width: 2px; }
.zq-input:disabled { background: var(--surface-sunken); opacity: .6; }
.zq-help { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.zq-error { font: 600 13px/18px var(--font-sans); color: var(--status-danger); display: flex; gap: var(--space-1); align-items: center; }
.zq-search { position: relative; }
.zq-search svg { position: absolute; inset-inline-start: 12px; top: 12px; width: 16px; height: 16px; color: var(--slate); }
.zq-search .zq-input { padding-inline-start: 36px; background: var(--surface-sunken); }

/* Skeleton */
.zq-skel { background: var(--surface-sunken); border-radius: var(--radius-xs); position: relative; overflow: hidden; }
.zq-skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--sage-soft), transparent); animation: zq-shimmer 1.4s infinite; }
@keyframes zq-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* Toast */
.zq-toast { display: flex; align-items: center; gap: var(--space-3); background: var(--surface-inverse); color: var(--ink-inverse); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font: 400 14px/20px var(--font-sans); box-shadow: var(--shadow-float); max-width: 420px; }
.zq-toast svg { width: 16px; height: 16px; flex: none; }
.zq-toast button { margin-inline-start: auto; background: none; border: 0; color: inherit; font: 600 14px/20px var(--font-sans); text-decoration: underline; cursor: pointer; padding: var(--space-1); }

/* Evidence drawer */
.zq-drawer { background: var(--surface-raised); border-inline-start: 1px solid var(--hairline); box-shadow: var(--shadow-drawer); width: 100%; max-width: 440px; display: flex; flex-direction: column; border-radius: var(--radius-lg) 0 0 var(--radius-lg); }
[dir="rtl"] .zq-drawer { border-radius: 0 var(--radius-lg) var(--radius-lg) 0; }
.zq-drawer-head { display: flex; justify-content: space-between; align-items: start; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--hairline); }
.zq-drawer-claim { font: 400 15px/22px var(--font-display); margin: var(--space-1) 0 0; color: var(--ink); }
.zq-tabs { display: flex; gap: var(--space-1); padding: 0 var(--space-5); border-bottom: 1px solid var(--hairline); }
.zq-tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: var(--space-3) var(--space-2); font: 600 14px/20px var(--font-sans); color: var(--ink-muted); cursor: pointer; }
.zq-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }
.zq-tab:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.zq-drawer-body { padding: var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); }
.zq-drawer-foot { padding: var(--space-3) var(--space-5); border-top: 1px solid var(--hairline); font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
@media (prefers-reduced-motion: reduce) { .zq-skel::after, .zq-spin { animation: none; } .zq-btn { transition: none; } }
.zq-error svg, .zq-btn svg { width: 14px; height: 14px; flex: none; }

/* Vertical timeline — spine on the inline-start side (mirrors in RTL) */
.zq-vt { max-width: 640px; padding: var(--space-4); }
.zq-vt-scale { font: 600 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-4); }
.zq-vt-list, .zq-vt-items { list-style: none; margin: 0; padding: 0; }
.zq-vt-era { position: relative; padding-inline-start: var(--space-6); padding-bottom: var(--space-5); }
.zq-vt-era::before { content: ""; position: absolute; inset-inline-start: 11px; top: 0; bottom: 0; border-inline-start: 2px solid var(--brand); }
.zq-vt-era-relative::before { border-inline-start: 2px dotted var(--slate); }
.zq-vt-era-undated-future::before { border-inline-start: 2px dashed var(--ev-unknown); }
.zq-vt-erahead { margin-bottom: var(--space-3); }
.zq-vt-erahead .zq-meta { margin-top: 2px; }
.zq-vt-item { position: relative; margin-bottom: var(--space-2); }
.zq-vt-mark { position: absolute; inset-inline-start: calc(-1 * var(--space-6) + 6px); top: 14px; }
.zq-vt-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--brand); border: 2px solid var(--surface); box-sizing: content-box; margin-inline-start: -2px; margin-top: -2px; }
.zq-vt-dia { width: 10px; height: 10px; transform: rotate(45deg); background: var(--surface); border: 2px solid var(--brass-ink); }
.zq-vt-bar { width: 8px; height: 28px; top: 6px; margin-inline-start: 2px; border-radius: var(--radius-xs); background: var(--sage); border: 1.5px solid var(--slate); }
.zq-vt-est { border-style: dashed; background: repeating-linear-gradient(135deg, var(--surface) 0 3px, var(--sage-soft) 3px 6px); }
.zq-vt-unk { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px dotted var(--ev-unknown); }
.zq-vt-btn { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--space-3); align-items: center; width: 100%; text-align: start; background: none; border: 1px solid transparent; border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); cursor: pointer; color: var(--ink); font-family: var(--font-sans); }
.zq-vt-btn:hover { background: var(--sage-soft); }
.zq-vt-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.zq-vt-btn[aria-current="true"] { background: var(--surface-raised); border-color: var(--brass); }
.zq-vt-when { grid-column: 1; font: 500 12px/16px var(--font-mono); color: var(--ink-muted); }
.zq-vt-title { grid-column: 1; font: 600 16px/22px var(--font-sans); color: var(--ink); }
.zq-vt-btn .zq-ev { grid-column: 2; grid-row: 1 / span 2; }
.zq-vt-break { position: relative; margin: var(--space-2) 0 0 calc(-1 * var(--space-6)); padding: var(--space-2) 0; display: flex; align-items: center; gap: var(--space-3); font: 600 13px/18px var(--font-sans); color: var(--brass-ink); }
.zq-vt-break::before { content: ""; width: 24px; height: 10px; border-block: 2px solid var(--brass); flex: none; }
.zq-vt-today { position: relative; padding-inline-start: var(--space-6); display: flex; align-items: baseline; gap: var(--space-3); padding-top: var(--space-1); }
.zq-vt-now { position: absolute; inset-inline-start: 4px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--brass); border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--brand); box-sizing: border-box; }
@media (max-width: 479px) { .zq-vt-btn { grid-template-columns: 1fr; } .zq-vt-btn .zq-ev { grid-column: 1; grid-row: auto; justify-self: start; } }

/* ===== Journey (glass) ===== */
.zq-glass { background: var(--glass-fill); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); border: 1px solid var(--glass-stroke); box-shadow: inset 0 1px 0 var(--glass-highlight), var(--shadow-glow); border-radius: var(--radius-lg); position: relative; overflow: hidden; }
.zq-glass::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, transparent 35%, var(--glass-highlight) 50%, transparent 65%); opacity: .35; transform: translateX(-120%); animation: zq-sheen 9s ease-in-out infinite; }
@keyframes zq-sheen { 0%, 70% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .zq-glass { background: var(--glass-fill-strong); } }
@media (prefers-reduced-transparency: reduce) { .zq-glass { background: var(--glass-fill-strong); backdrop-filter: none; -webkit-backdrop-filter: none; } }

/* Era tag */
.zq-era { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 600 12px/16px var(--font-sans); letter-spacing: .04em; color: var(--brass-ink); }
.zq-era-kind { font-weight: 400; color: var(--ink-muted); letter-spacing: 0; }
.zq-era-mark { width: 9px; height: 9px; flex: none; }
.zq-era-relative .zq-era-mark { transform: rotate(45deg); border: 1.5px solid currentColor; }
.zq-era-estimate .zq-era-mark { border: 1.5px dashed currentColor; border-radius: 2px; }
.zq-era-traditional .zq-era-mark { border-radius: 50%; border: 1.5px solid currentColor; background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.zq-era-exact .zq-era-mark { border-radius: 50%; background: currentColor; }
.zq-era-unknown .zq-era-mark { border-radius: 50%; border: 1.5px dotted currentColor; }
.zq-era-disputed .zq-era-mark { border: 3px double currentColor; width: 11px; height: 11px; }

/* Prophet journey card */
.zq-jc { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); color: var(--ink); font-family: var(--font-sans); max-width: 560px; transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
.zq-jc:hover { border-color: color-mix(in srgb, var(--glow-cyan) 45%, var(--glass-stroke)); transform: translateY(-2px); }
.zq-jc-collapsed { padding: var(--space-3) var(--space-4); }

<style>body{margin:0;background:var(--surface)}
.pp{font-family:var(--font-sans);color:var(--ink);background:var(--surface)}
.pp-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;padding:0 max(4vw,16px);border-bottom:1px solid var(--hairline);background:var(--surface-raised)}
.pp-brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:600 16px/1 var(--font-display);letter-spacing:.2em}
.pp-mono{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--brand);border-radius:var(--radius-md);font:600 18px/1 var(--font-display);color:var(--brand);letter-spacing:0}
.pp-wrap{max-width:1200px;margin:0 auto;padding:0 max(4vw,16px)}
.pp-crumb{display:flex;flex-wrap:wrap;gap:6px;font:400 13px/18px var(--font-sans);color:var(--ink-muted);padding:20px 0 0;margin:0;list-style:none}
.pp-crumb a{color:var(--ink-muted)}.pp-crumb li+li::before{content:"/";margin-inline-end:6px;color:var(--hairline)}
.pp-head{display:grid;grid-template-columns:72px 1fr;gap:8px 24px;align-items:start;padding:28px 0 32px;border-bottom:1px solid var(--hairline)}
.pp-mark{width:72px;height:72px;color:var(--brass)}
.pp-kick{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.pp-chap{font:600 11px/16px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass-ink)}
.pp-h1{margin:8px 0 4px;font:500 clamp(36px,5vw,52px)/1.08 var(--font-display);letter-spacing:-.01em}
.pp-h1 small{font:400 22px/1 var(--font-naskh);color:var(--ink-muted)}
.pp-ar{font:400 30px/1.5 var(--font-naskh);color:var(--ink);margin:0}
.pp-sub{margin:6px 0 0;font:400 18px/28px var(--font-display);color:var(--ink-muted);max-width:60ch}
.pp-meta{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.pp-acts{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pp-pos{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--hairline);font:400 14px/20px var(--font-sans)}
.pp-pos a{color:var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:2px}.pp-pos a:hover b{text-decoration:underline}
.pp-pos span{font:600 11px/14px var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.pp-pos .nx{text-align:end;align-items:flex-end}
.pp-era{font:600 12px/16px var(--font-sans);color:var(--brass-ink);text-align:center;border:1px solid var(--hairline);border-radius:var(--radius-pill);padding:6px 12px;background:var(--surface-raised)}
.pp-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;padding:32px 0 64px}
@media (min-width:1024px){.pp-grid{grid-template-columns:minmax(0,1fr) 340px}.pp-side{position:sticky;top:24px;align-self:start}}
.pp-toc{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.pp-toc a{flex:none;font:600 13px/18px var(--font-sans);color:var(--ink);text-decoration:none;border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 12px;background:var(--surface-raised)}
.pp-toc a:hover{background:var(--sage-soft)}
.pp-sec{scroll-margin-top:24px;margin-top:40px}.pp-sec:first-of-type{margin-top:16px}
.pp-sec>h2{font:600 28px/36px var(--font-display);margin:0 0 6px}
.pp-sec>p.lead{font:400 17px/28px var(--font-sans);color:var(--ink-muted);margin:0 0 20px;max-width:68ch}
.pp-steps{list-style:none;margin:0;padding:0;counter-reset:s}
.pp-step{position:relative;display:grid;grid-template-columns:40px 1fr;gap:4px 16px;padding:18px 0;border-top:1px solid var(--hairline)}
.pp-step::before{counter-increment:s;content:counter(s,decimal-leading-zero);font:500 13px/24px var(--font-mono);color:var(--brass-ink)}
.pp-step h3{margin:0;font:600 19px/26px var(--font-display);grid-column:2}
.pp-step p{margin:4px 0 0;font:400 17px/28px var(--font-sans);grid-column:2;max-width:68ch}
.pp-step .row{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.pp-empty{border:1px dashed var(--border);border-radius:var(--radius-md);padding:20px;background:var(--surface-raised);display:flex;flex-direction:column;gap:8px}
.pp-empty b{font:600 16px/22px var(--font-sans)}.pp-empty p{margin:0;color:var(--ink-muted);font:400 15px/24px var(--font-sans)}
.pp-map{position:relative;height:260px;border-radius:var(--radius-md);border:1px solid var(--hairline);overflow:hidden;background:var(--surface-sunken)}
.pp-map svg.base{position:absolute;inset:0;width:100%;height:100%}
.pp-map .zq-legend{position:absolute;inset-inline-end:12px;bottom:12px}
.pp-map .note{position:absolute;inset-inline-start:12px;top:12px;font:600 12px/16px var(--font-sans);color:var(--ink-muted);background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:4px 8px}
.pp-card{background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-md);padding:20px;display:flex;flex-direction:column;gap:12px}
.pp-card h3{margin:0;font:600 12px/16px var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.pp-sur{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pp-sur li{display:grid;grid-template-columns:36px 1fr;gap:2px 10px;padding:10px 0;border-top:1px solid var(--hairline)}.pp-sur li:first-child{border-top:0}
.pp-sur .n{grid-row:span 2;font:500 13px/22px var(--font-mono);color:var(--brass-ink)}
.pp-sur .t{font:400 15px/22px var(--font-sans)}.pp-sur .t b{font-weight:600}.pp-sur .t span{font:400 17px/1 var(--font-naskh);color:var(--ink-muted);margin-inline-start:6px}
.pp-side{display:flex;flex-direction:column;gap:16px}
.pp-side .zq-gen{padding:0;flex-direction:column;align-items:stretch;gap:0}
.pp-side .zq-edge{flex-direction:row;min-width:0;height:36px;justify-content:center;gap:8px}
.pp-side .zq-edge-line{width:0;height:100%;border-top:0;border-inline-start:2px solid var(--brand)}
.pp-side .zq-node{min-width:0}
.pp-msearch{display:none!important}.pp-nav .zq-btn{white-space:nowrap}.pp-foot{border-top:1px solid var(--hairline);padding:20px max(4vw,16px);font:400 13px/20px var(--font-sans);color:var(--ink-muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:640px){.pp-nav .zq-search{display:none}.pp-msearch{display:inline-flex!important}.pp-head{grid-template-columns:1fr}.pp-mark{width:48px;height:48px}.pp-meta,.pp-acts{grid-column:1}.pp-pos{grid-template-columns:1fr 1fr}.pp-era{display:none}}</style>
</head>
